.marquee{text-align:center;max-width:88vw;margin-bottom:clamp(24px,3.6vh,46px)}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;color:#834431;font:700 1.05rem/1.6 var(--serif);letter-spacing:.21em}
.brand span{position:relative;width:46px;height:1px;background:#aa8756}
.brand span:first-child:after,.brand span:last-child:before{content:"";position:absolute;top:-2px;right:0;width:5px;height:5px;transform:rotate(45deg);background:#aa8756}
.brand span:last-child:before{right:auto;left:0}
h1,h2,p{margin:0}
h1{font:800 clamp(2.5rem,4.15vw,4.15rem)/1.32 var(--serif);letter-spacing:.04em;color:#56282a;margin:5px 0 7px;text-wrap:balance}
.marquee p{font-size:clamp(1rem,1.3vw,1.18rem);line-height:1.6;color:#644b3d}
.desk{width:min(1130px,83%);display:grid;grid-template-columns:minmax(0,2.18fr) minmax(240px,1fr);align-items:start;gap:clamp(19px,2.2vw,36px)}
.script{position:relative;isolation:isolate;background:#fffaf0;border:1px solid #c6a97d;border-radius:6px;padding:clamp(22px,2.3vw,37px);box-shadow:1px 4px 0 -1px #f0dfc2,1px 5px 0 -1px #c7a97d,-2px 9px 0 -3px #f5e7cd,-2px 10px 0 -3px #cfb48d,0 13px 26px -9px #6c431a66}
.bookmark{position:absolute;top:-1px;right:clamp(26px,2.8vw,48px);width:24px;height:41px;line-height:28px;text-align:center;background:#92434a;color:#f1d49f;clip-path:polygon(0 0,100% 0,100% 100%,50% 81%,0 100%);font-size:18px}
.script-heading,.rack-title{display:flex;align-items:center;gap:12px}
h2{font:700 clamp(1.28rem,1.7vw,1.55rem)/1.3 var(--serif);letter-spacing:.08em}
.script-heading{color:var(--wine);margin-bottom:21px}
.head-rule{height:1px;background:#decaad;flex:1;margin:3px 30px 0 1px}
.book-icon{display:inline-flex;position:relative;width:25px;height:22px;align-items:center}
.book-icon:before,.book-icon:after{content:"";height:15px;width:10px;border:1.6px solid currentColor;border-radius:1px 4px 1px 1px;transform:skewY(9deg)}
.book-icon:after{border-radius:4px 1px 1px 1px;transform:skewY(-9deg);margin-left:-1px}
.passage{display:grid;gap:13px;font:500 clamp(1.18rem,1.57vw,1.53rem)/1.69 var(--serif);letter-spacing:.035em}
.passage b{font-weight:700}
.setting,.speech{padding:12px 17px;border-radius:5px;border:1px solid;border-left-width:4px;position:relative}
.setting{background:#f7e3dc;border-color:#e6b8ab;border-left-color:#c87968;color:#553831}
.cast{display:flex}.cast b{flex:none}
.speech{background:#e4edef;border-color:#c2d4d9;border-left-color:#7697a6;color:#30434c}
.speech p + p{margin-top:.65em}
.cue{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:.1em .42em;
  margin:.1em .14em;
  white-space:nowrap;
  vertical-align:middle;
  border:1.5px solid #80a371;
  border-radius:6px;
  background:#d3e7c8;
  color:#334a2e;
  font-size:.95em;
  line-height:1.45;
}
.cue.target.over{outline:3px solid #3a743b;outline-offset:2px;background:#c5e6b6}
.paper-rule{display:flex;gap:10px;align-items:center;margin-top:19px;font:14px/1 var(--serif);color:#b99869}
.paper-rule i{height:1px;background:#e6d6bd;flex:1}
.rack{color:#fff4dc;background:#75363c;border-radius:10px;padding:clamp(20px,1.85vw,30px);border:1px solid #693038;box-shadow:inset 0 0 0 4px #75363c,inset 0 0 0 5px #a86762,0 8px 17px -8px #63402577}
.rack-title{gap:11px}.rack-title h2{color:#fff6e4}
.tickets-icon{position:relative;display:inline-block;width:23px;height:20px;color:#efd4a9}
.tickets-icon:before,.tickets-icon:after{content:"";position:absolute;top:4px;left:1px;width:18px;height:12px;border:1.6px solid currentColor;border-radius:2px;transform:rotate(-17deg)}
.tickets-icon:after{left:4px;top:7px;transform:rotate(3deg);background:#75363c}
.rack-head p{margin-top:7px;font-size:.94rem;line-height:1.6;color:#f7dfcd}
.labels{display:grid;gap:13px;margin:21px 0}
.ticket{position:relative;display:flex;align-items:center;width:100%;padding:0;min-height:61px;background:#fff6e3;border:1px solid #d8bd8f;border-radius:5px;cursor:grab;touch-action:none;user-select:none;color:#4d3226;box-shadow:0 3px 0 #4f2227;font:700 clamp(1.25rem,1.65vw,1.6rem)/1.4 var(--serif);letter-spacing:.07em}
.ticket:before,.ticket:after{content:"";width:9px;height:11px;border-radius:50%;background:#75363c;position:absolute;top:calc(50% - 5.5px)}
.ticket:before{left:-5px}.ticket:after{right:-5px}
.grip{flex:none;display:grid;place-content:center;width:42px;align-self:stretch;border-right:1px dashed #c7a77d}
.grip:before{content:"";width:12px;height:18px;background:radial-gradient(circle,#aa8f71 1.4px,transparent 1.7px) 0 0 / 6px 6px}
.ticket>span{flex:1;text-align:center;padding:5px 15px 5px 5px}
.ticket:hover:not(:disabled),.ticket[aria-pressed=true]{background:#ffedca;box-shadow:0 0 0 2px #eac081,0 3px 0 #4f2227}
.ticket:disabled{cursor:default;background:#ecddc7;box-shadow:none}.ticket:disabled .grip:before{content:"✓";background:none;color:#476c42;font:bold 18px/18px var(--sans);width:auto}
.progress-block{border-top:1px dashed #ad7571;padding-top:16px}
.progress-line{display:flex;align-items:center;justify-content:space-between;font-size:.94rem}.progress-line b{font-weight:500}
#count{font-family:"DM Sans",var(--sans);font-weight:700;letter-spacing:.12em;color:#f5d498}
.meter{display:flex;gap:5px;margin-top:9px}.meter i{height:6px;background:#a16666;border-radius:4px;flex:1}.meter i.on{background:#e9c283}
.restart{border:none;background:none;color:#ffe9d0;cursor:pointer;font-size:.96rem;display:flex;gap:8px;align-items:center;justify-content:center;margin:13px auto -4px;padding:5px 10px;min-height:36px}.restart span{font:1.4rem/1 var(--sans)}.restart:hover{text-decoration:underline}
.picking [data-drop]{cursor:pointer}.target.over{outline:3px dashed #976d2d;outline-offset:2px}.target.wrong{animation:shake .28s ease-in-out}
.checked-mark{display:inline-block;vertical-align:.14em;border:1px solid currentColor;border-radius:4px;margin-inline-start:.5em;padding:0 .35em;font:600 .66em/1.55 var(--sans);white-space:nowrap;letter-spacing:0}.cue .checked-mark{margin:.1em .1em .1em 0}
.notice{position:fixed;bottom:clamp(12px,3vh,25px);left:50%;transform:translateX(-50%);max-width:90vw;width:max-content;text-align:center;padding:9px 20px;border-radius:8px;background:#46332a;color:white;font-size:1.04rem;box-shadow:0 3px 12px #35261533;z-index:10;pointer-events:none}.notice:empty{display:none}
.ghost{position:fixed;z-index:20;pointer-events:none;margin:0;opacity:.95;transform:translate(-50%,calc(-100% - 14px)) rotate(-3deg);box-shadow:0 9px 21px #3e292559}.ghost:before,.ghost:after{display:none}
@keyframes shake{25%,75%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@media(min-width:1450px){.stage{justify-content:center}}
@media(max-width:1050px){.desk{width:87%;grid-template-columns:minmax(0,1.95fr) minmax(220px,1fr)}.passage{font-size:1.16rem}.script,.rack{padding:21px}.grip{width:32px}}
@media(max-width:720px){.stage{padding:24px 0 50px}.marquee{max-width:92vw;margin-bottom:18px}.brand{font-size:.9rem}.marquee h1{font-size:clamp(1.8rem,6.8vw,2.65rem)}.marquee p{font-size:.96rem}.desk{width:92%;display:flex;flex-direction:column;gap:17px}.rack{order:-1;width:100%;padding:13px 15px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:7px 12px}.rack-head{grid-column:1}.rack-title{gap:8px}.rack-title h2{font-size:1.12rem}.rack-head p{font-size:.88rem;margin-top:3px}.labels{grid-column:1/-1;grid-row:2;display:flex;gap:8px;margin:1px 0}.ticket{min-height:44px;justify-content:center;font-size:1rem;letter-spacing:.025em}.grip{width:15px;border:0}.grip:before{width:6px;height:13px}.ticket>span{padding:4px 5px 4px 0}.progress-block{grid-column:2;grid-row:1;padding:0;border:0}.progress-line{gap:6px;font-size:.85rem}.meter{margin-top:4px}.meter i{height:4px}.restart{grid-column:2;grid-row:3;justify-self:end;font-size:.85rem;min-height:26px;margin:-4px 0 -5px;padding:3px 0}.script{padding:19px;width:100%}.script-heading{margin-bottom:16px}.passage{gap:11px;font-size:1.12rem}.setting,.speech{padding:9px 12px}.paper-rule{margin-top:15px}.notice{bottom:8px;font-size:.94rem}}
@media(prefers-reduced-motion:reduce){.target.wrong{animation:none}}

.celebration {
  width: min(39rem, calc(100% - 2rem));
  max-width: none;
  max-height: calc(100dvh - 2rem);
  margin: auto;
  padding: 0;
  border: 2px solid #c8954b;
  border-radius: 18px;
  background: #fff8e8;
  color: var(--wine);
  box-shadow: 0 24px 80px #35221e70;
}
.celebration::backdrop { background: rgb(49 29 28 / 68%); }
.celebration-card {
  isolation: isolate;
  position: relative;
  overflow: hidden;
  padding: clamp(1.7rem, 5vw, 3.5rem) 1rem;
  text-align: center;
  background: radial-gradient(ellipse at top, #ffe4aa, transparent 61%);
}
.celebration-card::before {
  content: "";
  position: absolute;
  inset: 8px;
  z-index: -1;
  border: 1px dashed #c29760;
  border-radius: 11px;
}
.award {
  position: relative;
  display: grid;
  place-items: center;
  width: 5.2rem;
  height: 5.2rem;
  margin: 0 auto 1.5rem;
  border-radius: 50%;
  background: repeating-conic-gradient(#ca9543 0deg 8deg, #edc671 8deg 16deg);
  box-shadow: 0 3px 0 #98692d;
}
.award::before, .award::after {
  content: "";
  position: absolute;
  z-index: -1;
  bottom: -.55rem;
  width: 1.6rem;
  height: 2rem;
  background: #8c4149;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 75%, 0 100%);
}
.award::before { left: .8rem; transform: rotate(20deg); }
.award::after { right: .8rem; transform: rotate(-20deg); }
.award span {
  display: grid;
  place-items: center;
  width: 78%;
  height: 78%;
  border: 2px solid #b1813c;
  border-radius: 50%;
  background: #ffe3a1;
  color: #873d38;
  font-size: 2.5rem;
  line-height: 1;
}
.celebration h2 {
  font: 800 clamp(2rem, 6vw, 3.8rem)/1.32 var(--serif);
  letter-spacing: .02em;
  text-wrap: balance;
}
.celebration p { margin: .65rem 0 1.6rem; color: #634739; font-size: clamp(1rem, 2vw, 1.25rem); }
.celebration-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: .7rem; }
.celebration-actions button {
  min-height: 44px;
  padding: .6rem 1.35rem;
  border: 1px solid var(--wine);
  border-radius: .5rem;
  background: #fffaf0;
  color: var(--wine);
  font-weight: 700;
  cursor: pointer;
}
.celebration-actions .review { background: var(--wine); color: #fffaf0; }
.celebration-actions button:hover { filter: brightness(.94); }
.confetti { position: absolute; z-index: -1; inset: 0; overflow: hidden; pointer-events: none; }
.confetti i {
  position: absolute;
  top: -1.3rem;
  left: calc(3% + var(--n) * 7%);
  width: .45rem;
  height: .95rem;
  border-radius: 2px;
  background: #cf9c3f;
}
.confetti i:nth-child(3n) { background: #9e525d; }
.confetti i:nth-child(3n + 1) { background: #65968d; }
@media (prefers-reduced-motion: no-preference) {
  .celebration[open] { animation: curtain-call .28s ease-out; }
  .celebration[open] .confetti i { animation: paper-fall 1.65s ease-in calc(var(--n) * 48ms) both; }
  @keyframes curtain-call { from { transform: translateY(14px) scale(.96); opacity: .5; } }
  @keyframes paper-fall {
    0% { top: -1.3rem; transform: rotate(0deg); opacity: 0; }
    15% { opacity: .8; }
    100% { top: 105%; transform: translateX(-1.4rem) rotate(235deg); opacity: 0; }
  }
}
</style>

<body>
<main class="stage">
  <header class="marquee">
    <div class="brand"><span aria-hidden="true"></span>課文小劇場<span aria-hidden="true"></span></div>
    <h1>《自相矛盾》<wbr>劇本配對</h1>
    <p>把三張標籤拖到課文中相應的顏色區域。</p>
  </header>
  <div class="desk">
    <section class="script" aria-labelledby="script-title">
      <div class="bookmark" aria-hidden="true">✧</div>
      <header class="script-heading"><i class="book-icon" aria-hidden="true"></i><h2 id="script-title">課文節選</h2><span class="head-rule" aria-hidden="true"></span></header>
      <div class="passage">
        <div class="setting target" data-drop="setting" role="button" tabindex="0">
          <div><b>時間：</b>古代某日中午</div>
          <div><b>地點：</b>市集</div>
          <div class="cast"><b>人物：</b><span>旁白、小販、顧客甲、顧客乙、顧客丙</span></div>
        </div>
        <div class="speech target" data-drop="speech">
          <p><span class="spoken" data-drop="speech" role="button" tabindex="0"><b>旁白：</b>很久很久以前，有一個賣兵器的人，他在市集上賣矛和盾……</span><span class="cue target" data-drop="cue" role="button" tabindex="0">（退下）</span></p>
          <p><span class="speaker" data-drop="speech"><b>小販：</b></span><span class="cue target" data-drop="cue" role="button" tabindex="0">（高聲大叫）</span><span class="spoken" data-drop="speech" role="button" tabindex="0" aria-label="小販的台詞">來啊來啊，快來看我賣的矛和盾！千萬別錯過了機會，它們都是最好的兵器啊！</span></p>
        </div>
      </div>
      <div class="paper-rule" aria-hidden="true"><i></i>✦<i></i></div>
    </section>
    <aside class="rack" aria-labelledby="rack-title">
      <div class="rack-head"><div class="rack-title"><span class="tickets-icon" aria-hidden="true"></span><h2 id="rack-title">組成部分</h2></div><p>拖曳標籤，或點選後再點課文。</p></div>
      <div class="labels">
        <button type="button" class="ticket" data-label="cue" aria-pressed="false"><i class="grip" aria-hidden="true"></i><span>舞台提示</span></button>
        <button type="button" class="ticket" data-label="setting" aria-pressed="false"><i class="grip" aria-hidden="true"></i><span>故事背景</span></button>
        <button type="button" class="ticket" data-label="speech" aria-pressed="false"><i class="grip" aria-hidden="true"></i><span>人物對白</span></button>
      </div>
      <div class="progress-block"><div class="progress-line"><b>配對進度</b><span id="count">0 / 3</span></div><div class="meter" aria-hidden="true"><i></i><i></i><i></i></div></div>
      <button class="restart" type="button"><span aria-hidden="true">↻</span> 重新開始</button>
    </aside>
  </div>
  <div class="notice" role="status" aria-live="polite" aria-atomic="true"></div>
</main>
<dialog class="celebration" aria-labelledby="celebration-title" aria-describedby="celebration-summary">
  <div class="celebration-card">
    <div class="confetti" aria-hidden="true"><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i><i style="--n:4"></i><i style="--n:5"></i><i style="--n:6"></i><i style="--n:7"></i><i style="--n:8"></i><i style="--n:9"></i><i style="--n:10"></i><i style="--n:11"></i><i style="--n:12"></i><i style="--n:13"></i></div>
    <div class="award" aria-hidden="true"><span>★</span></div>
    <h2 id="celebration-title">答對了，<wbr>你真棒！</h2>
    <p id="celebration-summary">你找到了劇本的三個組成部分！</p>
    <div class="celebration-actions">
      <button type="button" class="review" autofocus>查看配對</button>
      <button type="button" class="replay">再玩一次</button>
    </div>
  </div>
</dialog>

let messageTimer;
let frame = 0;
let ignorePointerClick = false;

function tell(message) {
  clearTimeout(messageTimer);
  notice.textContent = message;
  if (message) messageTimer = setTimeout(() => { notice.textContent = ""; }, 2600);
}

function select(ticket) {
  selected = ticket;
  for (const item of tickets) {
    item.setAttribute("aria-pressed", String(item === selected));
  }
  stage.classList.toggle("picking", Boolean(selected));
}

function choose(ticket) {
  select(ticket);
  tell("已選「" + ticket.textContent.trim() + "」，請點選課文。");
}

function refreshProgress() {
  count.textContent = matched.size + " / 3";
  segments.forEach((segment, index) => segment.classList.toggle("on", index < matched.size));
  restart.lastChild.textContent = matched.size === 3 ? " 再玩一次" : " 重新開始";
}

function markPassage(kind, label) {
  const blocks = [...passage.querySelectorAll(".target")].filter(block => block.dataset.drop === kind);
  for (const block of blocks) {
    const mark = document.createElement("span");
    mark.className = "checked-mark";
    mark.textContent = "✓ " + label;
    block.append(mark);
  }
}

function playFeedback(isCorrect) {
  const sound = isCorrect ? correctSound : wrongSound;
  const otherSound = isCorrect ? wrongSound : correctSound;
  otherSound.pause();
  sound.currentTime = 0;
  // Visual feedback remains available when the browser restricts playback.
  sound.play().catch(() => {});
}

function attempt(ticket, target) {
  if (!ticket || !target || ticket.disabled) return;
  const kind = ticket.dataset.label;
  const label = ticket.textContent.trim();
  const isCorrect = kind === target.dataset.drop;
  playFeedback(isCorrect);
  if (!isCorrect) {
    target.classList.remove("wrong");
    void target.offsetWidth;
    target.classList.add("wrong");
    select(null);
    tell("再試一次，看看這部分在劇本中有甚麼作用。");
    return;
  }
  matched.add(kind);
  ticket.disabled = true;
  select(null);
  markPassage(kind, label);
  refreshProgress();
  if (matched.size === tickets.length) {
    tell("");
    celebration.showModal();
  } else {
    tell("✓　「" + label + "」配對正確！");
  }
}

function resolveTarget(element, x, y) {
  const target = element?.closest(".target");
  if (target?.dataset.drop !== "speech" || selected?.dataset.label !== "cue") return target;

  // A near miss on the surrounding blue panel can still land on an inline direction.
  const tolerance = 16;
  for (const cue of cues) {
    const rect = cue.getBoundingClientRect();
    if (x >= rect.left - tolerance && x <= rect.right + tolerance &&
        y >= rect.top - tolerance && y <= rect.bottom + tolerance) return cue;
  }
  return target;
}

function targetAt(x, y) {
  return resolveTarget(document.elementFromPoint(x, y), x, y);
}

function hover(target) {
  if (target === hovering) return;
  hovering?.classList.remove("over");
  hovering = target;
  hovering?.classList.add("over");
}

function stopDrag() {
  if (!drag) return;
  const { ticket, id } = drag;
  drag = null;
  cancelAnimationFrame(frame);
  ghost?.remove();
  ghost = null;
  hover(null);
  if (ticket.hasPointerCapture(id)) ticket.releasePointerCapture(id);
}

function scrollDrag() {
  if (!drag || !ghost) return;
  const edge = Math.min(80, window.innerHeight / 6);
  const distance = drag.y < edge ? drag.y - edge : Math.max(0, drag.y - (window.innerHeight - edge));
  if (distance) {
    window.scrollBy(0, Math.max(-12, Math.min(12, distance * .2)));
    hover(targetAt(drag.x, drag.y));
  }
  frame = requestAnimationFrame(scrollDrag);
}

rack.addEventListener("pointerdown", event => {
  const ticket = event.target.closest("[data-label]");
  if (drag || !event.isPrimary || event.button !== 0 || !ticket || ticket.disabled) return;
  ignorePointerClick = false;
  drag = { ticket, id: event.pointerId, startX: event.clientX, startY: event.clientY, x: event.clientX, y: event.clientY };
  ticket.setPointerCapture(event.pointerId);
});

rack.addEventListener("pointermove", event => {
  if (!drag || event.pointerId !== drag.id) return;
  drag.x = event.clientX;
  drag.y = event.clientY;
  if (!ghost) {
    if (Math.hypot(drag.x - drag.startX, drag.y - drag.startY) < 6) return;
    select(drag.ticket);
    tell("");
    ghost = drag.ticket.cloneNode(true);
    ghost.classList.add("ghost");
    ghost.setAttribute("aria-hidden", "true");
    ghost.tabIndex = -1;
    ghost.style.width = drag.ticket.offsetWidth + "px";
    stage.append(ghost);
    frame = requestAnimationFrame(scrollDrag);
  }
  ghost.style.left = drag.x + "px";
  ghost.style.top = drag.y + "px";
  hover(targetAt(drag.x, drag.y));
});

rack.addEventListener("pointerup", event => {
  if (!drag || event.pointerId !== drag.id) return;
  const { ticket } = drag;
  const moved = Boolean(ghost);
  const target = targetAt(event.clientX, event.clientY);
  stopDrag();
  if (moved) {
    ignorePointerClick = true;
    if (target) attempt(ticket, target);
    else select(null);
  }
});

function cancelDrag(event) {
  if (drag && event.pointerId === drag.id) {
    stopDrag();
    select(null);
  }
}
rack.addEventListener("pointercancel", cancelDrag);
rack.addEventListener("lostpointercapture", cancelDrag);
window.addEventListener("blur", () => { if (drag) { stopDrag(); select(null); } });

rack.addEventListener("click", event => {
  const ticket = event.target.closest("[data-label]");
  if (ticket && !ticket.disabled && (!ignorePointerClick || event.detail === 0)) choose(ticket);
  ignorePointerClick = false;
});

function activateTarget(event) {
  const target = event.type === "click" && event.detail > 0
    ? resolveTarget(event.target, event.clientX, event.clientY)
    : event.target.closest(".target");
  if (!target) return;
  if (selected) {
    const keyboard = event.type === "keydown";
    attempt(selected, target);
    if (keyboard && !celebration.open) tickets.find(ticket => !ticket.disabled)?.focus();
  } else if (matched.size < 3) {
    tell("請先選一張組成部分標籤。");
  }
}
passage.addEventListener("click", activateTarget);
passage.addEventListener("keydown", event => {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    activateTarget(event);
  }
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") { stopDrag(); select(null); tell(""); }
});
function reorderTickets() {
  // Keep the label order different from the text and change the first card each round.
  const orders = [
    ["cue", "setting", "speech"], ["cue", "speech", "setting"],
    ["speech", "setting", "cue"], ["speech", "cue", "setting"],
    ["setting", "cue", "speech"]
  ];
  const choices = orders.filter(order => order[0] !== tickets[0].dataset.label);
  const order = choices[Math.floor(Math.random() * choices.length)];
  tickets.sort((a, b) => order.indexOf(a.dataset.label) - order.indexOf(b.dataset.label));
  rack.append(...tickets);
}

function restartGame() {
  if (celebration.open) celebration.close();
  stopDrag();
  select(null);
  correctSound.pause();
  wrongSound.pause();
  matched.clear();
  reorderTickets();
  for (const ticket of tickets) ticket.disabled = false;
  passage.querySelectorAll(".checked-mark").forEach(mark => mark.remove());
  passage.querySelectorAll(".wrong").forEach(block => block.classList.remove("wrong"));
  refreshProgress();
  tell("已重新開始。");
}

restart.addEventListener("click", restartGame);
celebration.querySelector(".review").addEventListener("click", () => celebration.close());
celebration.querySelector(".replay").addEventListener("click", () => {
  restartGame();
  tickets[0].focus();
});
celebration.addEventListener("close", () => {
  if (matched.size === tickets.length) restart.focus();
});
</script>
</body>
</html>
